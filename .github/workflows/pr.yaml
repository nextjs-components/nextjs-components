name: Pull Request
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm
        run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint with type information
        run: npm run lint

      - name: Validate changesets
        # Release PRs have already consumed their changesets.
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'changeset-release/')
        run: npm run changeset -- status --since origin/main

      - name: Test
        run: npm run test

      - name: Typecheck package
        run: npm run typecheck

      - name: Build docs with the local package
        run: npm run build --workspace=docs

      - name: Check package contents
        run: npm pack --workspace=nextjs-components --dry-run --ignore-scripts
